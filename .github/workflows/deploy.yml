name: Verify portfolio

on:
  push:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
    - name: Verify homepage and version
      run: node scripts/check-homepage.mjs
    - name: Install browser test tools
      run: |
        npm install --no-save --package-lock=false playwright@1.63.0
        npx playwright install --with-deps chrome webkit
        sudo apt-get install -y fonts-noto-cjk
    - name: Check desktop and mobile UI
      run: node scripts/check-browser.mjs
    - name: Upload browser evidence
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: browser-report
        path: browser-report/
        retention-days: 7
