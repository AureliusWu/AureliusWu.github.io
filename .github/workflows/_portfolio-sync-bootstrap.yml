name: Bootstrap portfolio sync

on:
  push:
    branches: [chore/portfolio-sync-v1]
    paths:
      - .github/workflows/_portfolio-sync-bootstrap.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Keep homepage cards compact
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('scripts/sync-projects.mjs')
          text = path.read_text(encoding='utf-8')
          replacement = '''function cardStatus(project, config) {
            return `v${project.current_version}`;
          }'''
          updated, count = re.subn(r'function cardStatus\(project, config\) \{[\s\S]*?\n\}', replacement, text, count=1)
          if count != 1:
              raise SystemExit('cardStatus function not found exactly once')
          path.write_text(updated, encoding='utf-8')
          PY

      - name: Generate synchronized portfolio state
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/sync-projects.mjs

      - name: Minify inline homepage CSS without changing content
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          def minify(match):
              attrs, css = match.group(1), match.group(2)
              css = re.sub(r'/\*[\s\S]*?\*/', '', css)
              css = re.sub(r'\s+', ' ', css)
              css = re.sub(r'\s*([{}:;,>])\s*', r'\1', css)
              return f'<style{attrs}>{css.strip()}</style>'

          updated, count = re.subn(r'<style\b([^>]*)>([\s\S]*?)</style>', minify, text, count=1, flags=re.I)
          if count != 1:
              raise SystemExit('inline style block not found exactly once')
          path.write_text(updated, encoding='utf-8')
          PY

      - name: Report homepage transfer budget
        run: node -e "const fs=require('fs'),z=require('zlib');const n=z.gzipSync(fs.readFileSync('index.html')).length;console.log('index.html gzip bytes:',n)"

      - name: Validate synchronized state
        run: |
          node scripts/check-portfolio-sync.mjs
          node scripts/check-homepage.mjs

      - name: Remove bootstrap workflow
        run: rm .github/workflows/_portfolio-sync-bootstrap.yml

      - name: Commit generated state and cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/sync-projects.mjs README.md index.html data/projects.json demos/*.html .github/workflows/_portfolio-sync-bootstrap.yml
          git commit -m "chore(portfolio): bootstrap synchronized project state"
          git push
