name: Repair portfolio desktop fit

on:
  push:
    branches: [chore/portfolio-sync-v1]
    paths:
      - .github/workflows/_portfolio-layout-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Tighten existing desktop spacing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          replacements = {
            '.page{width:min(1184px,100%);margin:auto;padding:16px 32px 12px;}': '.page{width:min(1184px,100%);margin:auto;padding:12px 32px 8px;}',
            'gap:12px;margin-bottom:12px;': 'gap:12px;margin-bottom:8px;',
            'flex-wrap:wrap;gap:16px;margin-bottom:14px;': 'flex-wrap:wrap;gap:12px;margin-bottom:10px;',
            '.eyebrow{margin:0 0 9px;': '.eyebrow{margin:0 0 6px;',
            'max-width:760px;margin:10px 0 0;': 'max-width:760px;margin:7px 0 0;',
            '.project-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;}': '.project-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;}',
            '.preview{position:relative;height:100px;padding:16px 16px 8px;': '.preview{position:relative;height:92px;padding:12px 16px 6px;',
            '.card-info{display:flex;flex:1;flex-direction:column;padding:14px;': '.card-info{display:flex;flex:1;flex-direction:column;padding:12px 14px;',
            '.description{margin:8px 0 0;': '.description{margin:6px 0 0;',
            'font-size:.875rem;line-height:1.6;}.focus{margin:7px 0 0;': 'font-size:.875rem;line-height:1.5;}.focus{margin:5px 0 0;',
            'font-size:.8125rem;line-height:1.6}.stack{display:flex;flex-wrap:wrap;gap:5px 10px;margin:10px 0 0;': 'font-size:.8125rem;line-height:1.5}.stack{display:flex;flex-wrap:wrap;gap:5px 10px;margin:7px 0 0;',
            'margin-top:auto;padding-top:12px;': 'margin-top:auto;padding-top:8px;',
            '.desktop .preview{width:40%;height:auto;min-height:210px;flex-shrink:0;padding:24px 10px 12px;}': '.desktop .preview{width:40%;height:auto;min-height:190px;flex-shrink:0;padding:18px 10px 10px;}',
            '.desktop .card-info{padding:16px;}footer{': '.desktop .card-info{padding:14px;}footer{',
            'margin-top:14px;color:var(--muted);font-size:.75rem;line-height:1.6;': 'margin-top:10px;color:var(--muted);font-size:.75rem;line-height:1.5;',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match for {old!r}, got {count}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate static gates
        run: |
          node scripts/check-portfolio-sync.mjs
          node scripts/check-homepage.mjs

      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chrome webkit
          sudo apt-get install -y fonts-noto-cjk

      - name: Validate desktop and mobile UI
        run: node scripts/check-browser.mjs

      - name: Remove repair workflow
        run: rm .github/workflows/_portfolio-layout-repair.yml

      - name: Commit validated layout repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/_portfolio-layout-repair.yml
          git commit -m "fix(portfolio): keep desktop overview within one screen"
          git push
