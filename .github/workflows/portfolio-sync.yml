name: Sync portfolio projects

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: portfolio-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Test repeated metadata synchronization
        run: node --test scripts/*.test.mjs

      - name: Sync project versions and public repositories
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/sync-projects.mjs

      - name: Validate synchronized metadata
        run: node scripts/check-portfolio-sync.mjs

      - name: Verify homepage structure
        run: node scripts/check-homepage.mjs

      - name: Detect changes
        id: changes
        shell: bash
        run: |
          if [ -z "$(git status --porcelain --untracked-files=all -- README.md index.html repositories.html data/projects.json data/repositories.json demos/*.html)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install browser test tools
        if: steps.changes.outputs.changed == 'true'
        run: |
          npm install --no-save --package-lock=false playwright@1.63.0
          npx playwright install --with-deps chrome webkit
          sudo apt-get install -y fonts-noto-cjk

      - name: Check desktop and mobile UI
        if: steps.changes.outputs.changed == 'true'
        run: node scripts/check-browser.mjs

      - name: Commit synchronized portfolio state
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md index.html repositories.html data/projects.json data/repositories.json demos/*.html
          git commit -m "chore(portfolio): sync project versions and public repositories"
          git push origin HEAD:main

      - name: Deploy synchronized commit or recover an unpublished one
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          sha=$(git rev-parse HEAD)
          remote_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$sha" != "$remote_sha" ]; then
            echo 'Main changed during synchronization; the newer commit takes precedence.'
            exit 0
          fi
          deployed=$({ curl -fsS --retry 1 --max-time 10 "https://aureliuswu.github.io/portfolio-build.json?sha=$sha" || true; } \
            | node -e 'try { console.log(JSON.parse(require("node:fs").readFileSync(0, "utf8")).commit ?? "") } catch {}')
          if [ "$deployed" = "$sha" ]; then
            echo 'This commit is already live.'
            exit 0
          fi
          gh workflow run deploy.yml --ref main -f "expected_sha=$sha"
