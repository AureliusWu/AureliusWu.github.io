<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="application-version" content="1.0.0">
  <meta name="description" content="Aurelius 的项目入口：蜉蝣基金、司南基金、全球新闻、司忆与 ImageLore。点击标题或功能预览即可进入项目。">
  <meta name="author" content="AureliusWu">
  <meta name="theme-color" content="#f3f5f8">
  <title>Aurelius · 项目主页</title>
  <link rel="canonical" href="https://aureliuswu.github.io/">
  <meta property="og:title" content="Aurelius · 项目主页">
  <meta property="og:description" content="五个项目，一屏直达。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://aureliuswu.github.io/">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%2317191f'/%3E%3Cpath d='M17 46 29 17h6l12 29h-7l-3-8H27l-3 8zm13-14h5l-2.5-7z' fill='white'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: light;
      --bg: #f3f5f8;
      --surface: #fff;
      --text: #17191f;
      --muted: #626a78;
      --line: #dde2eb;
      --accent: #5f61e8;
      --green: #168979;
      --orange: #d8732f;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --utility: "SFMono-Regular", Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--text); background: var(--bg); font-family: var(--font); -webkit-font-smoothing: antialiased; }
    a { color: inherit; }
    .page { width: min(1248px, 100%); height: 100svh; min-height: 520px; margin: auto; padding: 24px 32px 16px; display: flex; flex-direction: column; gap: 20px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 40px; flex-shrink: 0; }
    .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .brand-mark { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 12px; background: var(--text); color: white; font-weight: 750; font-size: 21px; }
    .brand-name { font-size: 18px; font-weight: 750; letter-spacing: -.04em; }
    .brand-note { border-left: 1px solid var(--line); padding-left: 12px; color: var(--muted); font-size: 12px; }
    .header-links { display: flex; align-items: center; gap: 20px; }
    .version { padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font: 12px var(--utility); color: var(--muted); white-space: nowrap; }
    .github { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; text-decoration: none; }
    .github:hover { color: var(--accent); }
    .github svg { width: 16px; height: 16px; fill: currentColor; }
    main { min-height: 0; flex: 1; display: flex; flex-direction: column; gap: 20px; }
    .intro { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-shrink: 0; }
    h1 { margin: 0; font-size: clamp(26px, 3.2vw, 36px); font-weight: 730; letter-spacing: -.06em; line-height: 1.2; }
    .intro p { margin: 8px 0 0; color: var(--muted); font-size: 13px; line-height: 1.4; }
    .project-count { color: var(--muted); font-size: 12px; white-space: nowrap; padding-bottom: 2px; }
    .project-count strong { font-family: var(--utility); color: var(--text); font-weight: 500; }
    .project-grid { min-height: 0; flex: 1; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .project-card { --project-color: var(--accent); grid-column: span 2; min-height: 0; display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); text-decoration: none; transition: border-color .16s, box-shadow .16s; }
    .project-card.desktop { grid-column: span 3; }
    .project-card:hover { border-color: var(--project-color); box-shadow: 0 5px 18px #17191f0b; }
    .project-card:focus-visible, .brand:focus-visible, .github:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .fundval { --project-color: var(--green); }
    .compass { --project-color: var(--accent); }
    .news { --project-color: var(--orange); }
    .agent { --project-color: var(--accent); }
    .imagelore { --project-color: var(--green); }
    .preview { position: relative; min-height: 0; flex: 1; padding: 14px 14px 0; background: #f8f9fc; overflow: hidden; }
    .preview-image { display: block; width: 100%; height: 100%; }
    .preview-label { position: absolute; top: 10px; right: 12px; padding: 3px 6px; border-radius: 4px; background: #ffffffee; color: var(--muted); font-size: 10px; line-height: 1.3; }
    .card-info { padding: 14px 18px 15px; flex-shrink: 0; }
    .card-heading { display: flex; align-items: center; gap: 10px; }
    h2 { margin: 0; font-size: 20px; line-height: 1.3; font-weight: 720; letter-spacing: -.035em; }
    .type { padding: 3px 6px; border-radius: 5px; background: #f3f5f8; color: var(--muted); font-size: 10px; line-height: 1.3; white-space: nowrap; }
    .arrow { margin-left: auto; color: var(--project-color); font-size: 20px; line-height: 1; transition: transform .16s; }
    .project-card:hover .arrow { transform: translate(2px, -2px); }
    .description { margin: 7px 0 0; color: var(--muted); font-size: 13px; line-height: 1.4; }
    footer { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-shrink: 0; color: var(--muted); font-size: 11px; line-height: 1.4; }
    footer p { margin: 0; }
    @media (min-width: 1440px) { .page { max-height: 900px; } }
    @media (max-width: 760px) {
      .page { padding: 16px; gap: 14px; min-height: 520px; }
      .topbar { min-height: 32px; }
      .brand-mark { width: 32px; height: 32px; border-radius: 10px; font-size: 19px; }
      .brand { gap: 8px; }
      .brand-name { font-size: 16px; }
      .brand-note { display: none; }
      .header-links { gap: 12px; }
      .version { padding: 5px 7px; font-size: 11px; }
      .github { font-size: 12px; }
      main { gap: 14px; }
      h1 { font-size: 26px; }
      .intro p { font-size: 12px; margin-top: 6px; }
      .project-count { display: none; }
      .project-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 10px; }
      .project-card, .project-card.desktop { grid-column: span 1; border-radius: 12px; }
      .project-card:last-child { grid-column: span 2; flex-direction: row; }
      .project-card:last-child .preview { flex: 1; padding: 10px 6px 0; }
      .project-card:last-child .card-info { width: 50%; align-self: center; padding: 12px; }
      .preview { padding: 8px 8px 0; }
      .preview-label { top: 6px; right: 6px; font-size: 9px; padding: 2px 4px; }
      .card-info { padding: 9px 10px 10px; }
      .card-heading { gap: 6px; }
      h2 { font-size: 16px; }
      .type { font-size: 9px; padding: 2px 4px; }
      .arrow { font-size: 17px; }
      .description { font-size: 11px; margin-top: 5px; line-height: 1.4; }
      footer { gap: 8px; font-size: 10px; }
    }
    @media (max-width: 380px) {
      .page { padding: 12px; gap: 10px; }
      main { gap: 10px; }
      h1 { font-size: 23px; }
      .intro p { font-size: 11px; }
      .card-heading { flex-wrap: wrap; gap: 4px; }
      h2 { font-size: 15px; }
      .type { margin-left: auto; }
      .arrow { display: none; }
      .card-info { padding: 8px; }
    }
    @media (min-width: 761px) and (max-height: 620px) {
      .page { padding: 12px 24px; gap: 10px; min-height: 360px; }
      main { gap: 10px; }
      .intro p { margin-top: 4px; }
      h1 { font-size: 26px; }
      .project-grid { gap: 10px; }
      .card-info { padding: 8px 12px; }
      h2 { font-size: 17px; }
      .description { font-size: 12px; margin-top: 4px; }
      .preview { padding: 8px 8px 0; }
    }
    @media (orientation: landscape) and (max-height: 460px) and (min-width: 600px) {
      .page { min-height: 300px; padding: 10px 16px; gap: 8px; }
      main { gap: 8px; }
      .intro { align-items: center; }
      .intro p { margin: 0; font-size: 11px; }
      .intro-copy { display: flex; align-items: center; gap: 16px; }
      h1 { font-size: 22px; }
      .project-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); grid-template-rows: minmax(0, 1fr); gap: 8px; }
      .project-card, .project-card.desktop, .project-card:last-child { grid-column: span 1; flex-direction: column; }
      .project-card:last-child .card-info { width: 100%; padding: 8px; }
      .card-info { padding: 8px; }
      .card-heading { gap: 4px; flex-wrap: wrap; }
      h2 { font-size: 15px; }
      .type { font-size: 9px; }
      .arrow { display: none; }
      .description { font-size: 11px; }
      footer { font-size: 10px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>
