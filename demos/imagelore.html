<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ImageLore Demo：15 秒功能示意视频。">
  <meta name="theme-color" content="#f3f5f8">
  <title>ImageLore Demo · Aurelius</title>
  <link rel="canonical" href="https://aureliuswu.github.io/demos/imagelore.html">
  <style>
:root { color-scheme: light; --bg:#f3f5f8; --text:#17191f; --muted:#626a78; --line:#dde2eb; --accent:#168979; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; }
a { color:inherit; }
.page { width:min(100%,1060px); margin:0 auto; padding:28px 24px 32px; }
nav { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:30px; }
.back { color:var(--muted); text-decoration:none; font-size:14px; padding:8px 0; }
.back:hover { color:var(--accent); }
.brand { font-size:14px; font-weight:700; letter-spacing:-.02em; }
.eyebrow { margin:0 0 8px; color:var(--accent); font-size:12px; font-weight:650; letter-spacing:.06em; }
h1 { margin:0; font-size:clamp(26px,5vw,38px); line-height:1.3; letter-spacing:-.045em; }
h1 span { color:var(--muted); font-size:.6em; font-weight:500; margin-left:8px; letter-spacing:0; }
.note { margin:10px 0 20px; color:var(--muted); font-size:14px; line-height:1.7; }
figure { margin:0; }
video { display:block; width:100%; height:auto; aspect-ratio:16/9; border:1px solid var(--line); border-radius:16px; background:#fff; }
figcaption { margin:10px 0 0; color:var(--muted); font-size:12px; line-height:1.6; }
.steps { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin:24px 0; padding:0; list-style:none; }
.steps li { padding:16px; background:#fff; border:1px solid var(--line); border-radius:12px; }
.step-number { display:block; margin-bottom:8px; color:var(--accent); font:12px "SFMono-Regular",Consolas,monospace; }
h2 { margin:0 0 6px; font-size:16px; line-height:1.4; }
.steps p { margin:0; color:var(--muted); font-size:13px; line-height:1.65; }
.actions { display:flex; align-items:center; flex-wrap:wrap; gap:12px; }
.primary,.secondary { display:inline-flex; align-items:center; min-height:44px; padding:11px 16px; border:1px solid var(--line); border-radius:10px; font-size:14px; font-weight:600; line-height:1.4; text-decoration:none; }
.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
.secondary { background:#fff; }
a:focus-visible,video:focus-visible { outline:3px solid var(--accent); outline-offset:4px; }
.access { color:var(--muted); font-size:12px; line-height:1.6; }
footer { margin-top:28px; color:var(--muted); font-size:12px; line-height:1.7; }
@media(max-width:600px) { .page { padding:16px; } nav { margin-bottom:22px; } .steps { grid-template-columns:1fr; margin:20px 0; gap:8px; } .steps li { padding:12px 14px; } .step-number { float:left; margin:3px 12px 0 0; } h2 { font-size:15px; } .steps p { margin-left:30px; } video { border-radius:12px; } }
  </style>
</head>
<body>
  <div class="page">
    <nav aria-label="页面导航"><a class="back" href="../index.html">← 返回主页</a><span class="brand">Aurelius</span></nav>
    <main>
      <p class="eyebrow">功能示意 · 15 秒</p>
      <h1>ImageLore<span>Demo</span></h1>
      <p class="note">以主页的界面示意展示核心流程，非实际操作录屏。点击播放即可观看。</p>
      <figure>
        <video controls playsinline preload="none" poster="media/imagelore-poster.svg" width="1280" height="720" aria-label="ImageLore Demo 功能示意视频">
          <source src="media/imagelore.mp4" type="video/mp4">
          <track kind="captions" src="media/imagelore.vtt" srclang="zh-CN" label="中文说明" default>
          当前浏览器无法播放视频。<a href="media/imagelore.mp4">直接打开 MP4 视频</a>。
        </video>
        <figcaption>无音频 · 提供中文说明字幕 · 视频中的界面和图形均为功能示意。</figcaption>
      </figure>
      <ol class="steps" aria-label="视频功能说明">
        <li><span class="step-number">01</span><h2>整理图片</h2><p>将图片与生成记录一起整理，建立创作收藏。</p></li>
        <li><span class="step-number">02</span><h2>查看生成记忆</h2><p>查看对应提示词，回顾图片的创作信息。</p></li>
        <li><span class="step-number">03</span><h2>回看版本与谱系</h2><p>沿版本与谱系，查看创作过程中的不同记录。</p></li>
      </ol>
      <div class="actions">
        <a class="primary" href="https://github.com/AureliusWu/ImageLore">打开 GitHub 项目页 ↗</a>
        <a class="secondary" href="media/imagelore.mp4" download="imagelore-demo.mp4">下载视频</a>
        <span class="access">私有仓库，需要相应 GitHub 访问权限。</span>
      </div>
    </main>
    <footer>由 Aurelius Wu 设计与构建 · <a href="../index.html">查看全部项目</a></footer>
  </div>
</body>
</html>
